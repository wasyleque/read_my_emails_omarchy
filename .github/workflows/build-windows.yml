name: Build Windows EXE

# Buduje MailVoice do .exe na Windows, tworzy instalator (Inno Setup) i publikuje w GitHub Releases.
# Wyzwalacze:
#   - push taga "v*" (np. v0.1.0-beta) -> buduje i tworzy Release (pre-release) z ZIP-em i instalatorem
#   - ręcznie z zakładki Actions (workflow_dispatch) -> buduje i zostawia artifacty (bez Release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # potrzebne do utworzenia Release i wgrania plików

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,voice,server]"
          pip install pyinstaller

      - name: Testy (bramka — bez zielonych testów nie budujemy)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Budowa .exe (PyInstaller, onedir)
        run: pyinstaller MailVoice.spec --noconfirm

      # --- PODPIS CYFROWY (opcjonalny, szablon) ---------------------------------------------------
      # Po zdobyciu certyfikatu code signing (polecany: Certum Open Source, polski CA, ~100-150 zł/rok)
      # dodaj w repo sekrety: WINDOWS_CERT_BASE64 (PFX zakodowany base64) i WINDOWS_CERT_PASSWORD,
      # a następnie ODKOMENTUJ poniższe dwa kroki (podpis .exe przed pakowaniem i podpis instalatora niżej).
      # - name: Podpis .exe
      #   if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
      #   shell: pwsh
      #   run: |
      #     [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}"))
      #     $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
      #     & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
      #       /fd SHA256 /tr http://time.certum.pl /td SHA256 "dist\MailVoice\MailVoice.exe"
      # --------------------------------------------------------------------------------------------

      - name: Spakowanie do ZIP
        run: Compress-Archive -Path dist/MailVoice/* -DestinationPath MailVoice-win64.zip

      - name: Instalacja Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Budowa instalatora (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $ver) { $ver = "0.1.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "installer\MailVoice.iss"

      # - name: Podpis instalatora
      #   if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
      #   shell: pwsh
      #   run: |
      #     $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
      #     & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
      #       /fd SHA256 /tr http://time.certum.pl /td SHA256 (Get-ChildItem installer\out\*.exe).FullName

      - name: Artifacty (dla ręcznego uruchomienia)
        uses: actions/upload-artifact@v4
        with:
          name: MailVoice-win64
          path: |
            MailVoice-win64.zip
            installer/out/*.exe
          retention-days: 14

      - name: Publikacja w Releases (tylko dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" MailVoice-win64.zip (Get-ChildItem installer\out\*.exe).FullName `
            --prerelease `
            --title "MailVoice ${{ github.ref_name }}" `
            --notes "Wersja testowa (beta) dla Windows 64-bit.

          Dwa warianty do wyboru:
          - MailVoice-Setup-*.exe — instalator (skróty w menu Start, deinstalator; instalacja bez administratora).
          - MailVoice-win64.zip — wersja przenośna: rozpakuj CAŁY folder i uruchom MailVoice.exe.

          Brak podpisu cyfrowego — Windows SmartScreen pokaże ,,nieznany wydawca'': Więcej informacji -> Uruchom mimo to.
          Głosy mowy pobierają się przy pierwszym użyciu; TTS na Windows korzysta z głosów systemowych (SAPI)."
