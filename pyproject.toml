[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailvoice"
version = "0.1.0"
description = "Głosowy asystent poczty e-mail z lokalnym modelem AI"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "imap-tools>=1.5.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
fido2 = [
    "fido2>=1.1",
]
server = [
    "aiohttp>=3.9",
    "segno>=1.6",
]
voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "piper-tts>=1.2",
]

[project.scripts]
mailvoice = "mailvoice.__main__:main"
mailvoice-server = "mailvoice.headless:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
